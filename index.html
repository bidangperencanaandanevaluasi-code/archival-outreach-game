<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archival Outreach — Expert Challenge</title><style>
:root{--navy:#102a58;--blue:#176ad4;--yellow:#ffd326;--pale:#eef6ff;--ink:#172d4b;--muted:#60738b;--line:#d8e5f3;--green:#0c8064;--red:#bc3753}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eaf5ff,#fbfdff 48%,#fff8dc);font-family:Inter,Arial,sans-serif;color:var(--ink)}header{background:linear-gradient(110deg,#0d2c60,#176cce);color:#fff;padding:22px 28px;border-bottom:7px solid var(--yellow)}.wrap{max-width:1120px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:var(--yellow)}h1{margin:5px 0;font-size:clamp(25px,4vw,43px)}h2{font-size:clamp(22px,3vw,30px);margin:0 0 8px}p{line-height:1.55}.small{font-size:13px;color:var(--muted)}.header-sub{color:#deecff;font-size:14px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#ffffff18;border:1px solid #ffffff50;padding:10px 15px;border-radius:12px;min-width:100px;text-align:center}.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:#e8f4ff}.progress{height:9px;background:#d8e6f8;border-radius:99px;overflow:hidden;margin:17px 0}.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--yellow));transition:width .2s}.card{background:white;border:1px solid var(--line);border-radius:19px;padding:25px;box-shadow:0 10px 30px #173b6c15;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.chip{display:inline-block;background:var(--pale);padding:6px 11px;border-radius:99px;font-size:12px;font-weight:800;color:var(--blue)}button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:11px 16px;font-weight:750}.primary{background:var(--blue);color:#fff}.primary:hover{background:#084da7}.secondary{background:#e8f1ff;color:#174e8b}.secondary:hover{background:#d0e7ff}.yellow{background:var(--yellow);color:var(--navy)}button:disabled{opacity:.48;cursor:not-allowed}input,select{font:inherit;padding:10px 11px;border:1px solid #adc7e8;border-radius:9px;width:100%;background:white;color:var(--ink)}label{font-weight:700;font-size:13px;display:block;margin-bottom:7px}.field{padding:8px 0}.qrow{border:1px solid var(--line);border-radius:13px;padding:13px;margin:12px 0;background:#fbfdff}.qrow strong{display:block;margin-bottom:8px}.choicebar{display:flex;flex-wrap:wrap;gap:7px}.choice{background:#eef3fb;color:#234872;border:1px solid #bdd4ed;padding:8px 11px;font-size:13px}.choice.selected{background:#164f99;color:white;border-color:#164f99}.orderrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:8px 10px;margin:7px 0;background:#fbfdff}.orderrow .num{font-weight:900;color:var(--blue);width:23px}.orderrow .grow{flex:1}.orderrow button{padding:5px 11px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.feedback{background:#fff7d6;border-left:5px solid #f7c800;padding:14px;border-radius:9px;margin-top:15px;line-height:1.6}.feedback.good{background:#e6f9f2;border-color:var(--green)}.feedback.bad{background:#fff0f1;border-color:var(--red)}.info{background:#eef6ff;border-left:5px solid var(--blue);padding:13px;border-radius:9px}.hidden{display:none!important}.meter{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.dot{background:#e6edf7;border-radius:9px;padding:7px 11px;font-size:12px;font-weight:750;color:#526c88}.dot.done{background:#d9f7eb;color:#0b7559}.dot.active{background:#ffef9c;color:#664c00}.big{font-size:clamp(34px,6vw,64px);font-weight:900;color:var(--blue);letter-spacing:2px}.code{letter-spacing:8px;font-family:monospace;font-size:27px;text-align:center;max-width:300px}.foot{padding:20px;color:#566f8c;font-size:12px;text-align:center}.info-row{display:flex;gap:12px;align-items:flex-start}.icon{font-size:31px}.mini{font-size:12px;color:#4b6581}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #dbe7f4;text-align:left;padding:10px;font-size:13px}th{background:#e9f3ff}kbd{background:#dceaff;padding:3px 6px;border-radius:5px}.locked{opacity:.75}#confetti{font-size:32px}@media(max-width:650px){.top{flex-direction:column;align-items:flex-start}.grid,.grid3,.two{grid-template-columns:1fr}.card{padding:17px}.wrap{padding:13px}.choice{font-size:12px}.stats{gap:6px}.stat{min-width:90px}}
</style></head><body>
<header><div class="wrap top"><div><div class="eyebrow">PELATIHAN FUNGSIONAL ARSIPARIS KETERAMPILAN</div><h1>ARCHIVAL OUTREACH</h1><div class="header-sub">EXPERT CHALLENGE · 7 MISI KASUS · TANPA PILIHAN A/B/C</div></div><div class="stats"><div class="stat"><b id="time">30:00</b><span>WAKTU</span></div><div class="stat"><b id="score">0</b><span>POIN</span></div><div class="stat"><b id="phase">0/7</b><span>MISI</span></div></div></div></header>
<main class="wrap"><div class="progress"><div id="progress" style="width:0"></div></div><div id="nav" class="meter"></div><section class="card" id="screen"></section></main><div class="foot">Studi kasus seluruhnya simulasi. Pelayanan arsip statis berada pada lembaga kearsipan; keputusan akses harus mengikuti ketentuan yang berlaku.</div>
<script>
'use strict';const $=id=>document.getElementById(id), escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let started=false,remaining=1800,step=0,score=0,usedHints={},solved={},answers={},timer=null,name='',finished=false;
const titles=['Kurator Kritis','Susun Storyline','Audit Caption','Penelusuran Presisi','Audit Hasil Pindai','Perbaiki Metadata','Meja Layanan'];
const story=['Tetapkan tujuan dan audiens','Pilih tema yang relevan','Telusuri dan periksa sumber arsip','Verifikasi akses dan kondisi fisik','Susun narasi serta desain','Uji materi dan lakukan persetujuan'];
const storyInit=[2,4,0,5,1,3];
const caseRows=[
['Foto kegiatan penyuluhan hukum 2014; sumber dan izin penggunaan terverifikasi','Siap dipertimbangkan'],
['Berkas perkara aktif yang memuat identitas saksi','Tidak dipublikasikan'],
['Foto gedung lama; tanggal dan hak penggunaannya belum jelas','Periksa lebih lanjut'],
['Salinan keputusan organisasi yang telah dinyatakan terbuka oleh pejabat berwenang','Siap dipertimbangkan'],
['Catatan pemeriksaan saksi dalam proses penyidikan','Tidak dipublikasikan'],
['Poster sejarah institusi; memakai gambar milik pihak ketiga tanpa izin','Periksa lebih lanjut']];
const recordRows=[
{id:'A17',year:2022,kind:'Laporan',subject:'Penyuluhan hukum',unit:'Penerangan Hukum',access:'Terbuka'},
{id:'B02',year:2021,kind:'Surat',subject:'Pengadaan peralatan',unit:'Umum',access:'Terbatas'},
{id:'C31',year:2022,kind:'Foto',subject:'Penyuluhan hukum',unit:'Penerangan Hukum',access:'Terbuka'},
{id:'D19',year:2022,kind:'Laporan',subject:'Perkara pidana',unit:'Pidum',access:'Terbatas'},
{id:'E04',year:2023,kind:'Laporan',subject:'Penyuluhan hukum',unit:'Penerangan Hukum',access:'Terbuka'},
{id:'F27',year:2022,kind:'Laporan',subject:'Penyuluhan hukum',unit:'Penerangan Hukum',access:'Terbatas'},
{id:'G10',year:2022,kind:'Laporan',subject:'Penyuluhan hukum',unit:'Penerangan Hukum',access:'Terbuka'}];
const qaIssues=[['Hasil halaman 2 terpotong di sisi kanan','Pindai ulang halaman terkait'],['Halaman 4 tersimpan terbalik','Rotasi atau pindai ulang lalu verifikasi'],['Halaman 5 hilang dari berkas PDF','Lengkapi halaman yang hilang'],['Folder digital dapat diakses seluruh pegawai','Batasi akses sesuai kewenangan'],['Nama berkas tidak menggambarkan isinya','Perbaiki penamaan berkas']];
const serviceCases=[['Pegawai internal meminta laporan program yang berkaitan dengan tugasnya','Verifikasi kewenangan dan berikan jika diizinkan'],['Wartawan meminta BAP saksi perkara yang sedang berjalan','Proses melalui PPID dan pemeriksaan pengecualian'],['Peneliti meminta arsip statis sejarah kota yang dikelola ANRI','Rujuk ke lembaga kearsipan pengelola'],['Peneliti meminta arsip statis tertutup untuk riset khusus','Ajukan permohonan akses khusus kepada lembaga kearsipan']];
const choicesAccess=['Verifikasi kewenangan dan berikan jika diizinkan','Proses melalui PPID dan pemeriksaan pengecualian','Rujuk ke lembaga kearsipan pengelola','Ajukan permohonan akses khusus kepada lembaga kearsipan'];
function update(){ $('score').textContent=score;$('phase').textContent=Math.min(step,7)+'/7';$('progress').style.width=(Math.min(step,7)/7*100)+'%';$('time').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');$('nav').innerHTML=titles.map((t,i)=>'<span class="dot '+(i<step?'done':i===step?'active':'')+'">'+(i+1)+'. '+t+'</span>').join('')}
function begin(){const n=$('player').value.trim();if(!n){$('error').textContent='Masukkan nama peserta/kelompok terlebih dahulu.';return}name=n;started=true;remaining=1800;step=0;score=0;answers={};solved={};usedHints={};finished=false;timer=setInterval(()=>{if(!finished){remaining=Math.max(0,remaining-1);update();if(remaining===0){clearInterval(timer);endGame(true)}}},1000);render()}
function intro(){ $('screen').innerHTML='<span class="chip">LEVEL LANJUT · 30 MENIT</span><h2>Selamat Datang di Ruang Kendali Arsip</h2><p>Anda adalah tim kurator dan petugas informasi yang harus menuntaskan <b>7 kasus terintegrasi</b> sebelum membuka brankas arsip. Tidak ada pilihan A/B/C: Anda harus <b>mengklasifikasikan dokumen, menyusun urutan, memperbaiki data, menganalisis hasil pindai, dan mengambil keputusan akses</b>.</p><div class="grid3"><div class="info"><b>🧠 Tingkat ahli</b><p>Penalaran berbasis skenario dan bukti</p></div><div class="info"><b>🔐 Kode brankas</b><p>Didapat setelah menyelesaikan 7 misi</p></div><div class="info"><b>💡 Bantuan terbatas</b><p>Satu petunjuk per misi (potong 15 poin)</p></div></div><div class="field"><label for="player">Nama peserta / kelompok</label><input id="player" placeholder="Contoh: Tim Arsiparis Kejari A" maxlength="60"></div><div id="error" class="small" style="color:#bc3753"></div><div class="actions"><button class="primary" onclick="begin()">Mulai Tantangan →</button></div>';update()}
function choose(k,v){answers[k]=v;let root=document.querySelector('[data-key="'+k+'"]');if(root){root.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b.dataset.val===v))}}
function choiceRow(key,question,opts){let current=answers[key];return '<div class="qrow" data-key="'+key+'"><strong>'+question+'</strong><div class="choicebar">'+opts.map(v=>'<button type="button" data-val="'+escapeHTML(v)+'" class="choice '+(current===v?'selected':'')+'" onclick="choose(\''+key+'\',this.dataset.val)">'+escapeHTML(v)+'</button>').join('')+'</div></div>'}
function navButtons(hint){return '<div class="actions"><button class="primary" onclick="check()">Periksa Hasil Misi</button><button class="secondary" onclick="showHint()">💡 Petunjuk (-15)</button></div><div id="hint" class="feedback hidden">'+hint+'</div><div id="response"></div>'}
function render(){update(); if(!started){intro();return}if(step===7){vault();return}let html='<span class="chip">MISI '+(step+1)+' DARI 7 · '+titles[step].toUpperCase()+'</span>';let hint='';
if(step===0){html+='<h2>Kurator Kritis: Seleksi 6 Dokumen</h2><p>Galeri sejarah akan dibuka. Putuskan status <b>setiap berkas</b> sebelum masuk publikasi. Jangan menganggap dokumen boleh ditampilkan hanya karena tersedia.</p>'+caseRows.map((r,i)=>choiceRow('c'+i,(i+1)+'. '+r[0],['Siap dipertimbangkan','Periksa lebih lanjut','Tidak dipublikasikan'])).join('');hint='Arsip perkara aktif dan identitas saksi membutuhkan perlindungan. Dokumen lain tetap perlu verifikasi sumber, izin, dan kewenangan.'}
if(step===1){if(!answers.order)answers.order=storyInit.map(i=>story[i]);html+='<h2>Susun Storyline dan Tahapan Kerja</h2><p>Enam kartu tahapan tercampur. Susun dari perencanaan hingga persetujuan materi pameran menggunakan tombol ↑ ↓.</p><div id="order"></div>';hint='Mulailah dari <b>tujuan dan audiens</b>, lanjutkan tema serta penelusuran, lalu pengamanan, produksi, dan persetujuan.'}
if(step===2){html+='<h2>Audit Caption yang Menyesatkan</h2><p>Sebuah caption dibuat: <i>“Kejaksaan Negeri X meresmikan gedung pada 1985, arsip asli pasti terbuka dan bisa digandakan bebas.”</i> Sumber foto yang tersedia hanya menunjukkan <b>tampak depan gedung</b>, tanggal <b>sekitar 1980-an</b>, koleksi <b>Album Foto Kelembagaan X</b>. Susun caption yang aman dengan mengisi komponen berikut.</p><div class="grid">'+['Objek visual','Perkiraan waktu','Sumber arsip','Status publikasi'].map((label,i)=>'<div class="field"><label>'+label+'</label><select id="cap'+i+'"><option value="">— pilih isi yang dapat dipertanggungjawabkan —</option>'+[["Tampak depan gedung Kejaksaan Negeri X","Peresmian gedung Kejaksaan Negeri X"],["Sekitar 1980-an","1985 (pasti)"],["Album Foto Kelembagaan X","Dokumen resmi tahun 1985"],["Perlu verifikasi hak penggunaan dan status akses","Boleh digandakan bebas tanpa pemeriksaan"]][i].map(v=>'<option>'+v+'</option>').join('')+'</select></div>').join('')+'</div>';hint='Jangan menambahkan peristiwa atau tahun pasti yang tidak dapat dibuktikan. Sumber dan batas pemanfaatan harus dinyatakan secara akurat.'}
if(step===3){html+='<h2>Penelusuran Presisi: Temukan 2 Arsip</h2><p>Permintaan: <b>laporan penyuluhan hukum tahun 2022</b> dari unit <b>Penerangan Hukum</b> yang <b>berstatus terbuka</b>. Telusuri tabel dan ketik <b>dua ID</b> yang memenuhi semua kriteria, pisahkan dengan koma.</p><div style="overflow:auto"><table><tr><th>ID</th><th>Tahun</th><th>Jenis</th><th>Subjek</th><th>Unit</th><th>Akses</th></tr>'+recordRows.map(r=>'<tr><td>'+r.id+'</td><td>'+r.year+'</td><td>'+r.kind+'</td><td>'+r.subject+'</td><td>'+r.unit+'</td><td>'+r.access+'</td></tr>').join('')+'</table></div><div class="field"><label>ID yang lolos seluruh filter</label><input id="ids" placeholder="contoh: A17, G10" value="'+escapeHTML(answers.ids||'')+'"></div>';hint='Cocokkan <b>kelima</b> unsur sekaligus: jenis laporan, subjek, tahun, unit, dan status terbuka.'}
if(step===4){html+='<h2>Audit Hasil Pindai: Temukan 5 Tindakan Korektif</h2><p>Anda menerima dokumen hasil digitalisasi yang akan diunggah ke sistem. Tentukan tindakan penanganan yang paling tepat untuk setiap temuan.</p>'+qaIssues.map((r,i)=>choiceRow('q'+i,(i+1)+'. '+r[0],['Pindai ulang halaman terkait','Rotasi atau pindai ulang lalu verifikasi','Lengkapi halaman yang hilang','Batasi akses sesuai kewenangan','Perbaiki penamaan berkas'])).join('');hint='Jangan menyamakan masalah kualitas gambar, kelengkapan dokumen, keamanan akses, dan penamaan berkas.'}
if(step===5){html+='<h2>Perbaiki Metadata Arsip</h2><p>Data mentah: <b>Laporan Kegiatan Penyuluhan Hukum</b>; tanggal <b>12 Agustus 2022</b>; unit <b>Penerangan Hukum</b>; jenis <b>Laporan</b>; status <b>Terbatas</b>. Petugas membuat metadata keliru. Isi lima bidang berikut dengan benar.</p><div class="grid">'+[['Judul arsip','m0','Laporan Perkara'],['Tanggal ISO (YYYY-MM-DD)','m1','2023-08-12'],['Unit pencipta','m2','Umum'],['Jenis arsip','m3','Surat'],['Klasifikasi akses','m4','Terbuka']].map(r=>'<div class="field"><label>'+r[0]+'</label><input id="'+r[1]+'" value="'+escapeHTML(answers[r[1]]||'')+'" placeholder="Kesalahan: '+r[2]+'"></div>').join('')+'</div>';hint='Gunakan judul, tanggal, unit, jenis, dan status persis dari data mentah. Tanggal ISO memakai format tahun-bulan-hari.'}
if(step===6){html+='<h2>Meja Layanan: Putuskan Kewenangan</h2><p>Empat permintaan masuk sekaligus. Tentukan jalur layanan yang tepat. Ingat bahwa <b>arsip statis dikelola lembaga kearsipan</b>, bukan otomatis dilayani oleh Kejaksaan.</p>'+serviceCases.map((r,i)=>choiceRow('s'+i,(i+1)+'. '+r[0],choicesAccess)).join('');hint='Bedakan hak akses internal, proses PPID untuk informasi yang dikecualikan, kewenangan lembaga kearsipan, dan permohonan akses khusus.'}
$('screen').innerHTML=html+navButtons(hint);if(step===1)drawOrder()}
function drawOrder(){let list=answers.order;$('order').innerHTML=list.map((x,i)=>'<div class="orderrow"><span class="num">'+(i+1)+'</span><span class="grow">'+escapeHTML(x)+'</span><button class="secondary" onclick="move('+i+',-1)" '+(i===0?'disabled':'')+'>↑</button><button class="secondary" onclick="move('+i+',1)" '+(i===list.length-1?'disabled':'')+'>↓</button></div>').join('')}
function move(i,delta){let a=answers.order,j=i+delta;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];drawOrder()}
function showHint(){let h=$('hint');if(!usedHints[step]){usedHints[step]=true;update()}h.classList.remove('hidden')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function check(){let total=0,max=0,miss=[],detail='';if(step===0){max=6;caseRows.forEach((r,i)=>{if(answers['c'+i]===r[1])total++;else miss.push(i+1)})}
if(step===1){max=6;answers.order.forEach((x,i)=>{if(x===story[i])total++;else miss.push(i+1)})}
if(step===2){max=4;let targets=['Tampak depan gedung Kejaksaan Negeri X','Sekitar 1980-an','Album Foto Kelembagaan X','Perlu verifikasi hak penggunaan dan status akses'];targets.forEach((t,i)=>{if($('cap'+i).value===t)total++;else miss.push(i+1)})}
if(step===3){max=2;answers.ids=$('ids').value;let actual=new Set(answers.ids.toUpperCase().split(/[;,\s]+/).filter(Boolean)),wanted=new Set(['A17','G10']);total=[...wanted].filter(x=>actual.has(x)).length;if([...actual].some(x=>!wanted.has(x)))total=Math.max(0,total-1);if(total<2)miss=['periksa filter dan ID tambahan']}
if(step===4){max=5;qaIssues.forEach((r,i)=>{if(answers['q'+i]===r[1])total++;else miss.push(i+1)})}
if(step===5){max=5;for(let i=0;i<5;i++)answers['m'+i]=$('m'+i).value;let targets=['Laporan Kegiatan Penyuluhan Hukum','2022-08-12','Penerangan Hukum','Laporan','Terbatas'];targets.forEach((t,i)=>{if(norm(answers['m'+i])===norm(t))total++;else miss.push(i+1)})}
if(step===6){max=4;serviceCases.forEach((r,i)=>{if(answers['s'+i]===r[1])total++;else miss.push(i+1)})}
const missionPoints=Math.round(total/max*100);let points=Math.max(0,missionPoints-(usedHints[step]?15:0));if(solved[step])return;solved[step]=true;score+=points;update();let full=total===max;let explanation=['Publikasi memerlukan pemeriksaan hak akses, sumber, izin, dan keamanan; arsip perkara aktif serta identitas saksi tidak ditayangkan.','Alur kerja dimulai dari tujuan dan audiens sampai pemeriksaan akhir serta persetujuan materi.','Caption harus berdasarkan fakta arsip; jangan menambahkan tanggal peresmian atau klaim keterbukaan yang tidak terbukti.','Hanya A17 dan G10 memenuhi kelima kriteria secara bersamaan.','Temuan kualitas, kelengkapan, hak akses, dan penamaan harus ditangani sesuai penyebabnya.','Metadata tepat: Laporan Kegiatan Penyuluhan Hukum; 2022-08-12; Penerangan Hukum; Laporan; Terbatas.','Penuhi layanan sesuai kewenangan: internal terverifikasi, PPID, lembaga kearsipan, dan akses khusus.'][step];$('response').innerHTML='<div class="feedback '+(full?'good':'bad')+'"><b>'+ (full?'Misi tuntas tanpa kesalahan!':'Audit selesai — ada aspek yang perlu diperbaiki')+'</b><div>Ketepatan: <b>'+total+'/'+max+'</b> · Poin misi: <b>'+points+'</b></div>'+(miss.length?'<div>Bagian yang perlu ditinjau: '+miss.join(', ')+'</div>':'')+'<p>'+explanation+'</p></div><div class="actions"><button class="yellow" onclick="next()">'+(step===6?'Buka Tantangan Brankas →':'Lanjut ke Misi Berikutnya →')+'</button></div>';document.querySelectorAll('#screen button.choice,#screen button.secondary').forEach(b=>b.disabled=true);$('screen').querySelector('.actions .primary').disabled=true}
function next(){if(!solved[step])return;step++;render()}
function vault(){update();$('screen').innerHTML='<span class="chip">FINAL · BRANKAS ARSIP</span><h2>Satukan Bukti dan Buka Brankas</h2><p>Tim Anda telah melewati tujuh misi. Untuk membuka brankas, susun kode empat digit berdasarkan bukti yang ditemukan:</p><div class="grid"><div class="info"><b>Digit 1</b><p>Jumlah jenis materi utama Archival Outreach dalam pelatihan ini</p></div><div class="info"><b>Digit 2</b><p>Jumlah dokumen pada Misi Kurator Kritis yang <b>tidak dipublikasikan</b></p></div><div class="info"><b>Digit 3</b><p>Jumlah ID arsip yang benar pada Misi Penelusuran Presisi</p></div><div class="info"><b>Digit 4</b><p>Jumlah permintaan layanan pada Misi Meja Layanan</p></div></div><div class="field"><label>Kode brankas (4 digit)</label><input class="code" id="vaultcode" inputmode="numeric" maxlength="4" placeholder="••••"></div><div id="vaultmsg"></div><div class="actions"><button class="yellow" onclick="unlock()">🔐 Buka Brankas</button></div>'}
function unlock(){let c=$('vaultcode').value.replace(/\D/g,'');if(c==='7224'){score+=150;endGame(false)}else{$('vaultmsg').innerHTML='<div class="feedback bad">Kode belum tepat. Cocokkan kembali jumlah yang ditanyakan dari setiap misi, bukan urutan jawaban.</div>'}}
function endGame(timeout){if(finished)return;finished=true;clearInterval(timer);update();let pct=Math.round(score/850*100),tier=pct>=85?'ARSIPARIS MASTER':pct>=65?'ARSIPARIS ANDAL':'ARSIPARIS DALAM PENGEMBANGAN';$('screen').innerHTML='<span class="chip">REKAP HASIL · ARCHIVAL OUTREACH</span><h2>'+(timeout?'Waktu Habis — Hasil Tersimpan':'Brankas Arsip Berhasil Dibuka!')+'</h2><div id="confetti">🏛️ 📚 🔐 🗂️</div><div class="big">'+score+' <span style="font-size:19px;color:#647c97">/ 850</span></div><h3>'+tier+'</h3><p><b>Peserta/Kelompok:</b> '+escapeHTML(name)+'</p><p><b>Misi selesai:</b> '+Object.keys(solved).length+' dari 7 · <b>Petunjuk dipakai:</b> '+Object.values(usedHints).filter(Boolean).length+' · <b>Waktu tersisa:</b> '+Math.floor(remaining/60)+' menit '+remaining%60+' detik</p><div class="info">Penilaian ini untuk permainan edukatif; keputusan pelayanan nyata tetap harus mengacu pada pejabat berwenang dan ketentuan peraturan yang berlaku.</div><div class="actions"><button class="primary" onclick="copyResult()">📋 Salin Rekap</button><button class="secondary" onclick="restart()">↻ Main Lagi</button></div><div id="copied" class="small"></div>'}
function copyResult(){let txt='ARCHIVAL OUTREACH — EXPERT CHALLENGE\nPeserta: '+name+'\nSkor: '+score+'/850\nMisi selesai: '+Object.keys(solved).length+'/7\nPetunjuk: '+Object.values(usedHints).filter(Boolean).length+'\nSisa waktu: '+remaining+' detik';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>$('copied').textContent='Rekap berhasil disalin.').catch(()=>fallbackCopy(txt))}else fallbackCopy(txt)}
function fallbackCopy(s){let a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{document.execCommand('copy');$('copied').textContent='Rekap disalin.'}catch(e){$('copied').textContent=s}a.remove()}
function restart(){clearInterval(timer);started=false;step=0;score=0;usedHints={};solved={};answers={};remaining=1800;finished=false;intro()}
intro();
</script></body></html>
